name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # ReleaseAudit verifies an integrity-bound golden snapshot from Git history.
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake spec

  prism-minimum:
    runs-on: ubuntu-latest
    name: Ruby 3.2 / Prism 1.0
    env:
      BUNDLE_GEMFILE: gemfiles/prism_min.gemfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Ruby and minimum Prism
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Verify identity, lookup, blockers, report schema, and semantics inventory
        run: >-
          bundle exec rspec
          spec/necropsy/definition_identity_spec.rb
          spec/necropsy/call_site_identity_spec.rb
          spec/necropsy/core_method_lookup_spec.rb
          spec/necropsy/parse_incompleteness_spec.rb
          spec/necropsy/report_schema_spec.rb
          spec/necropsy/semantics_matrix_spec.rb

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake rubocop

  docs-links:
    runs-on: ubuntu-latest
    name: Documentation links
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Check relative Markdown links
        run: ruby script/check_documentation_links.rb

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: gem build necropsy.gemspec

  safety-contract:
    runs-on: ubuntu-latest
    name: Actionability and safety contract
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify actionability and proof workflows
        run: >-
          bundle exec rspec
          spec/necropsy/trust_contract_spec.rb
          spec/necropsy/ci_actionability_spec.rb
          spec/necropsy/feedback_workflow_spec.rb
          spec/necropsy/guardrail/causal_diff_spec.rb
          spec/necropsy/removal_workflow_spec.rb
